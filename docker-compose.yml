version: '3.8'

services:
  # Servicio de base de datos PostgreSQL
  postgres:
    image: postgis/postgis:15-3.3
    container_name: observatorio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio_regulatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - observatorio_network

  # Servicio de backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: observatorio_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-observatorio_regulatorio}
      NODE_ENV: production
      PORT: 3000
    networks:
      - observatorio_network

  # Servicio de frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: observatorio_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - observatorio_network

networks:
  observatorio_network:
    driver: bridge

volumes:
  postgres_data:
